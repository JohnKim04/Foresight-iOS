name: Foresight
options:
  minimumXcodeGenVersion: 2.44.0
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: 26.0
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CLANG_ENABLE_MODULES: YES
    GENERATE_INFOPLIST_FILE: NO
    # Override in Config/Signing.local.xcconfig if these bundle IDs are taken by another Apple team.
    BUNDLE_ID_PREFIX: com.foresight
  configs:
    # The app and its widget share the journal through this App Group. Debug and Release are
    # separate apps, so each gets its own group.
    Debug:
      APP_GROUP_IDENTIFIER: group.$(BUNDLE_ID_PREFIX).journal.testing
    Release:
      APP_GROUP_IDENTIFIER: group.$(BUNDLE_ID_PREFIX).journal
configs:
  Debug: debug
  Release: release
targets:
  Foresight:
    type: application
    platform: iOS
    sources:
      - path: ForesightApp
        excludes:
          - "*.entitlements"
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: ForesightWidget
    # Device signing lives in Config/Signing.xcconfig, which includes a gitignored
    # Config/Signing.local.xcconfig for the team ID. See "Run on your iPhone" in the README.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        INFOPLIST_FILE: ForesightApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_MODULE_NAME: Foresight
        SUPPORTS_MACCATALYST: NO
        # Set in Config/Signing.xcconfig, so a team without App Groups can turn it off locally.
        CODE_SIGN_ENTITLEMENTS: $(FORESIGHT_APP_ENTITLEMENTS)
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).journal.testing
          PRODUCT_NAME: Foresight QA
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG ENABLE_DEVELOPMENT_FIXTURES
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).journal
          PRODUCT_NAME: Foresight
  ForesightWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ForesightWidget
        excludes:
          - "*.entitlements"
          - Info.plist
      # The widget reads the journal with the app's own models.
      - path: ForesightApp/Models.swift
      - path: ForesightApp/ForesightSchema.swift
      - path: ForesightApp/SharedJournal.swift
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        INFOPLIST_FILE: ForesightWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(FORESIGHT_WIDGET_ENTITLEMENTS)
        PRODUCT_NAME: ForesightWidget
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).journal.testing.widget
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).journal.widget
  ForesightTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Foresight
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Foresight QA.app/Foresight QA"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
  ForesightUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ForesightUITests
    dependencies:
      - target: Foresight
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Foresight
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
schemes:
  Foresight QA:
    build:
      targets:
        Foresight: all
        ForesightTests: [test]
        ForesightUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ForesightTests
        - ForesightUITests
    archive:
      config: Release
